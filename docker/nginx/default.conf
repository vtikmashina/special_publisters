server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    location ^~ /report/ {
        return 410;
    }

    location = /research/telegram-channels/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<script src="/research/telegram-channels/mobile-fallback.js"></script></body>';
        try_files /research/telegram-channels/index.html =404;
    }

    location = /research/telegram-channels/index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<script src="/research/telegram-channels/mobile-fallback.js"></script></body>';
        try_files /research/telegram-channels/index.html =404;
    }

    location = /research/telegram-channels/mobile-fallback.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /research/telegram-channels/_next/static/chunks/0d-rwp289d_1p.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /research/telegram-channels/_next/static/chunks/0jygeyb7dr5-n.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /research/telegram-channels/_next/static/chunks/0s-r44z9q6fzv.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /research/telegram-channels/_next/static/chunks/1_zb1yfmwc807.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location ^~ /research/telegram-channels/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|json|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
